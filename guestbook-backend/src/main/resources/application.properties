spring.application.name=guestbook

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
server.servlet.context-path=/api

# debugging logs
# Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
# JWT decoder
logging.level.org.springframework.security.oauth2.jwt=DEBUG
# Web layer (request/response)
logging.level.org.springframework.web=DEBUG
# DispatcherServlet (routing)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG



# Baza danych PostgreSQL w AWS
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/guestbook
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator


#minIO
s3.endpoint=http://minio:9000
s3.bucket=media
s3.access-key=minioadmin
s3.secret-key=minioadmin
