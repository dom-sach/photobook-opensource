spring.application.name=guestbook

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
#server.servlet.context-path=/api

# debugging logs
# Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
# JWT decoder
logging.level.org.springframework.security.oauth2.jwt=DEBUG
# Web layer (request/response)
logging.level.org.springframework.web=DEBUG
# DispatcherServlet (routing)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG


s3.endpoint=${MINIO_ENDPOINT}
s3.access.key=${MINIO_ACCESS_KEY}
s3.secret.key=${MINIO_SECRET_KEY}
s3.bucket=${MEDIA_BUCKET}
s3.public.base-url=${PUBLIC_BASE_URL}


# Baza danych PostgreSQL w AWS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Wersja bazy lokalnej do testów
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/guestbook
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/api/actuator
management.metrics.tags.application=guestbook-backend

